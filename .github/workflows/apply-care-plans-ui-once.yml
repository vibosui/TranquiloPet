name: Apply care plan UI once

on:
  push:
    branches:
      - agent/hospeda-patas-foundation
    paths:
      - scripts/apply-care-plans-ui.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hospeda-patas-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded source patch
        run: node scripts/apply-care-plans-ui.mjs
      - name: Refresh package lock
        run: npm install --package-lock-only
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/app/'(app)'/hosting/'[eventId].tsx' apps/mobile/src/app/'(app)'/'(tabs)'/profile/index.tsx apps/mobile/src/app/'(app)'/'(tabs)'/index.tsx apps/mobile/src/app/'(app)'/contacts/index.tsx package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire care plans into hosting UX"
          git push origin HEAD:agent/hospeda-patas-foundation
